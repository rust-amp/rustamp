name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  licenses:
    name: Permissive crates stay GPL-free (required)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # RFC 0004 acceptance 4, the load-bearing invariant of the licensing
      # split: rustamp-proto, rustamp-plugin-abi, rustamp-ipc and
      # rustamp-plughost are MIT OR Apache-2.0, so no copyleft crate may enter
      # their dependency closure. The script uses cargo only (cargo tree), for
      # all four crates on both Windows targets. `cargo tree --target` resolves
      # the graph and never builds, so the i686 target's std is not needed here.
      - name: Check the permissive crates' dependency closures
        shell: bash
        run: bash .github/scripts/check-permissive-licenses.sh

  windows:
    name: Windows (required)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: i686-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

      - name: Build plugin host (i686)
        run: cargo build -p rustamp-plughost --target i686-pc-windows-msvc

  linux:
    name: Linux (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check workspace
        run: cargo check --workspace
