name: Release

# Builds the portable release zip and the installer with the same command the
# maintainers use locally (`cargo xtask package --release --zip --installer`). Triggered by a version tag
# or by hand; a tag also creates a DRAFT GitHub release so nothing is published
# without a human pressing the button.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  package:
    name: Release build and zip
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # The original base skin is Winamp's own and is not in this repository.
      # The acceptance tests load it from webamp's MIT checkout, pinned by hash,
      # and fail (not skip) if it is missing.
      - name: Fetch the base-2.91 skin (webamp)
        shell: bash
        run: |
          mkdir -p skins
          curl -fsSL -o skins/base-2.91.wsz https://raw.githubusercontent.com/captbaritone/webamp/master/packages/webamp/assets/skins/base-2.91.wsz
          echo "cb2e5361a5208878855ae2c6c4a842df6cb71590b2c4405fe8776258c82e59bb  skins/base-2.91.wsz" | sha256sum -c -
          echo "RUSTAMP_BASE291_SKIN=$(pwd -W)/skins/base-2.91.wsz" >> "$GITHUB_ENV"
          echo "RUSTAMP_REQUIRE_BASE291=1" >> "$GITHUB_ENV"

      # The release must not ship on a red tree: run the same gate as CI.
      - name: Test (headless)
        run: cargo test --workspace --all-features

      # Portable NSIS for the installer, pinned by hash; nothing is installed.
      - name: Fetch NSIS
        shell: bash
        run: |
          curl -fsSL -o nsis.zip "https://sourceforge.net/projects/nsis/files/NSIS%203/3.13/nsis-3.13.zip/download"
          echo "ba63dffc4410ee89193e1cb5a41989991bd77c61068da17e3156d136b7b0b3d8  nsis.zip" | sha256sum -c -
          # Windows' own tar (bsdtar) reads a zip; the `tar` first on the PATH in Git Bash is GNU tar, which cannot.
          "$SYSTEMROOT/System32/tar.exe" -xf nsis.zip -C "$(cygpath -w "$RUNNER_TEMP")"
          echo "MAKENSIS=$(cygpath -w "$RUNNER_TEMP/nsis-3.13/makensis.exe")" >> "$GITHUB_ENV"

      - name: Package
        run: cargo xtask package --release --zip --installer

      - name: Collect archive and installer
        id: collect
        shell: bash
        run: |
          mkdir -p dist
          find target/package -maxdepth 1 \( -name 'rustamp-*.zip*' -o -name 'rustamp-*-setup.exe*' \) \
            -exec cp {} dist/ \;
          ls -l dist
          test -n "$(ls dist/*.zip 2>/dev/null)"
          test -n "$(ls dist/*-setup.exe 2>/dev/null)"
          echo "notes=docs/RELEASE-NOTES-${GITHUB_REF_NAME#v}.md" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rustamp-release
          path: dist/*

      - name: Draft GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: ${{ steps.collect.outputs.notes }}
          files: dist/*
