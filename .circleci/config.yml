# CircleCI: test every push, and build + publish a release for every `v*` tag.
#
# Runs on the Windows executor: the player is a 64-bit Windows program and the
# plug-in host is 32-bit (i686), both MSVC. Only the HEADLESS tests run here;
# the window tests are `#[ignore]`d and run in the Hyper-V test VM (AGENTS.md).
#
# Project environment variables (Project Settings > Environment Variables):
#   GITLAB_TOKEN       a GitLab token with the `api` scope (publishes the release)
#   GITLAB_PROJECT_ID  numeric GitLab project id (88040400 for rustamp/rustamp)
version: 2.1

orbs:
  win: circleci/windows@5.0

commands:
  fetch_source:
    description: >-
      HTTPS checkout. The built-in `checkout` clones over SSH with a deploy key
      whose format the Windows OpenSSH cannot load (libcrypto: unsupported).
    steps:
      - run:
          name: Checkout (HTTPS)
          command: |
            set -eu
            : "${GITLAB_TOKEN:?set GITLAB_TOKEN in the project settings}"
            git clone --quiet "https://oauth2:${GITLAB_TOKEN}@gitlab.com/rustamp/rustamp.git" .
            git checkout --quiet "${CIRCLE_TAG:-$CIRCLE_SHA1}"
            git remote set-url origin https://gitlab.com/rustamp/rustamp.git

  rust:
    description: Install Rust (stable, MSVC, plus the i686 target) once per job.
    steps:
      - run:
          name: Install Rust
          command: |
            if ! command -v rustup >/dev/null 2>&1; then
              curl -sSf -o rustup-init.exe https://win.rustup.rs/x86_64
              ./rustup-init.exe -y --default-toolchain stable --profile minimal \
                --component rustfmt --component clippy
            fi
            export PATH="$USERPROFILE/.cargo/bin:$PATH"
            rustup target add i686-pc-windows-msvc
            cargo --version
      - restore_cache:
          keys:
            - cargo-v1-{{ arch }}-{{ checksum "Cargo.lock" }}
            - cargo-v1-{{ arch }}-

jobs:
  test:
    executor:
      name: win/server-2022
      size: large
      shell: bash.exe
    steps:
      - fetch_source
      - rust
      - run:
          name: Format
          command: |
            export PATH="$USERPROFILE/.cargo/bin:$PATH"
            cargo fmt --all -- --check
      - run:
          name: Clippy
          no_output_timeout: 30m
          command: |
            export PATH="$USERPROFILE/.cargo/bin:$PATH"
            cargo clippy --workspace --all-targets --all-features -- -D warnings
      # The original base skin is Winamp's own and is not in this repository.
      # The acceptance tests load it from webamp's MIT checkout, pinned by hash,
      # and fail (not skip) if it is missing.
      - run:
          name: Fetch the base-2.91 skin (webamp)
          command: |
            set -eu
            mkdir -p skins
            curl -fsSL -o skins/base-2.91.wsz               https://raw.githubusercontent.com/captbaritone/webamp/master/packages/webamp/assets/skins/base-2.91.wsz
            echo "cb2e5361a5208878855ae2c6c4a842df6cb71590b2c4405fe8776258c82e59bb  skins/base-2.91.wsz" | sha256sum -c -
      - run:
          name: Test (headless)
          no_output_timeout: 30m
          command: |
            export PATH="$USERPROFILE/.cargo/bin:$PATH"
            export RUSTAMP_BASE291_SKIN="$(pwd -W)/skins/base-2.91.wsz"
            export RUSTAMP_REQUIRE_BASE291=1
            cargo test --workspace --all-features
      - run:
          name: Build the 32-bit plug-in host
          command: |
            export PATH="$USERPROFILE/.cargo/bin:$PATH"
            cargo build -p rustamp-plughost --target i686-pc-windows-msvc
      - save_cache:
          key: cargo-v1-{{ arch }}-{{ checksum "Cargo.lock" }}
          paths:
            - ~/.cargo/registry
            - ~/.cargo/git
            - target

  release:
    executor:
      name: win/server-2022
      size: large
      shell: bash.exe
    steps:
      - fetch_source
      - rust
      - run:
          name: Package (release build + portable zip + installer)
          no_output_timeout: 45m
          command: |
            set -eu
            export PATH="$USERPROFILE/.cargo/bin:$PATH"
            # Portable NSIS, pinned by hash; nothing is installed.
            curl -fsSL -o nsis.zip "https://sourceforge.net/projects/nsis/files/NSIS%203/3.13/nsis-3.13.zip/download"
            echo "ba63dffc4410ee89193e1cb5a41989991bd77c61068da17e3156d136b7b0b3d8  nsis.zip" | sha256sum -c -
            unzip -q nsis.zip -d "$TEMP"
            export MAKENSIS="$(cygpath -w "$TEMP/nsis-3.13/makensis.exe")"
            version=$(awk '/^\[workspace.package\]/{found=1;next} found && /^\[/{exit} found && /^version = /{gsub(/["\r]/, "", $3); print $3; exit}' Cargo.toml)
            test -n "$version"
            if [ "$CIRCLE_TAG" != "v$version" ]; then
              echo "Release tag $CIRCLE_TAG does not match workspace version $version" >&2
              exit 1
            fi
            date=$(git log -1 --format=%cd --date=format:%Y-%m-%d)
            commit=$(git rev-parse --short=7 HEAD)
            package_dir="target/package/rustamp-$version+$date.$commit"
            cargo xtask package --release --zip --installer --out "$package_dir"
            mkdir -p dist
            cp "$package_dir.zip" "$package_dir.zip.sha256" "$package_dir-setup.exe" "$package_dir-setup.exe.sha256" dist/
            ls -l dist
      - store_artifacts:
          path: dist
          destination: release
      - run:
          name: Publish to the GitLab release
          command: |
            set -eu
            : "${GITLAB_TOKEN:?set GITLAB_TOKEN in the project settings}"
            : "${GITLAB_PROJECT_ID:?set GITLAB_PROJECT_ID in the project settings}"
            tag="$CIRCLE_TAG"
            api="https://gitlab.com/api/v4/projects/$GITLAB_PROJECT_ID"
            links=""
            for f in dist/*; do
              name=$(basename "$f")
              curl --fail -sS -H "PRIVATE-TOKEN: $GITLAB_TOKEN" -T "$f" \
                "$api/packages/generic/rustamp/$tag/$name"
              url="$api/packages/generic/rustamp/$tag/$name"
              links="$links{\"name\":\"$name\",\"url\":\"$url\",\"link_type\":\"package\"},"
            done
            body="{\"tag_name\":\"$tag\",\"name\":\"Rustamp $tag\",\"description\":\"Windows build ($tag): portable zip (unzip anywhere) and per-user installer. Verify the .sha256 next to each file.\",\"assets\":{\"links\":[${links%,}]}}"
            code=$(curl -sS -o release.json -w '%{http_code}' -X POST \
              -H "PRIVATE-TOKEN: $GITLAB_TOKEN" -H "Content-Type: application/json" \
              -d "$body" "$api/releases")
            if [ "$code" = 409 ]; then
              # A re-run of the same tag: the release and its asset links exist;
              # the packages above were replaced under the same URLs.
              echo "release $tag already exists, keeping it"
            elif [ "$code" != 201 ]; then
              cat release.json; exit 1
            fi

workflows:
  test-every-push:
    jobs:
      - test:
          filters:
            tags:
              ignore: /.*/
  release-on-tag:
    jobs:
      - test:
          name: test-before-release
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v.*/
      - release:
          requires:
            - test-before-release
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v.*/
