[package]
name = "rustamp-app"
description = "Rustamp: the application binary that wires all crates together"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "rustamp"
path = "src/main.rs"

[dependencies]
rustamp-core.workspace = true
rustamp-audio.workspace = true
rustamp-decoders.workspace = true
rustamp-dsp.workspace = true
rustamp-output.workspace = true
rustamp-meta.workspace = true
rustamp-playlist.workspace = true
rustamp-skin.workspace = true
rustamp-gfx.workspace = true
rustamp-ui.workspace = true
rustamp-vis.workspace = true
rustamp-milkdrop.workspace = true
rustamp-ipc.workspace = true
rustamp-platform.workspace = true
rustamp-prefs.workspace = true
rustamp-plugin-abi.workspace = true
rustamp-library.workspace = true
# The plugin host's own crate carries the host-death contract (the exit codes
# the host uses and the restart policy the supervisor applies), so the two
# processes cannot drift apart: see `rustamp-plughost::restart`.
rustamp-plughost.workspace = true
# The app owns the OS window and the event loop, so it drives `winit` and
# `softbuffer` directly (the `rustamp-ui` presenter is a manual example and
# drops the commands the machine emits).
winit.workspace = true
softbuffer.workspace = true
# Config file I/O (the core crate only defines the types; see RFC 0001).
toml.workspace = true
# The equalizer's auto-load rules file is TOML with a hand-written shape, so
# it is deserialized through serde's derive.
serde.workspace = true
# The local control channel (`src/control.rs`, `--control`): one JSON object
# per line over a named pipe. Already in the workspace for the same switch;
# `serde` carries the types, `serde_json` the line.
serde_json.workspace = true
# Diagnostics: the startup banner and the notes of the event loops are
# `tracing` events, and `RUST_LOG` decides which of them reach stderr. See
# `src/diag.rs`; stdout stays the headless protocol's alone. The default
# feature set is narrowed to the fmt layer, its ANSI colouring and the
# `RUST_LOG` filter: `tracing-log` (and the private `smallvec` that only the
# default set needs) would be an unused dependency, because the subscriber is
# a registry with our own layer, not `fmt::init`.
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "ansi", "env-filter"] }


[dev-dependencies]
tempfile.workspace = true
# The control-channel test (`tests/control.rs`) drives the real binary through
# this crate's client half.
rustamp-testkit.workspace = true
# The skins-folder tests write real `.wsz` archives, so the scan sees the
# same files a user drops into the folder. Already a workspace dependency
# through `rustamp-skin`, so nothing new is fetched.
zip.workspace = true
# The library's test writes a row whose path the file system refuses to
# name straight into the index's database, because no scan can produce such
# a path. The same crate and the same features as `rustamp-library` use, so
# the build is shared and no new package enters the lockfile.
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
# Capture side of the VM-only loopback test (`tests/loopback.rs`); already a
# workspace dependency through `rustamp-output`, so nothing new is fetched.
cpal.workspace = true
# The local TLS server of the `https://` CLI tests: rcgen mints the certificate,
# rustls serves it. Both are test-only - the player itself never names rustls;
# it asks the decoders for a stream. Same versions/features as rustamp-decoders
# uses, so nothing new enters the lock.
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
rustls = "0.23"

[build-dependencies]
embed-manifest = "1.5.1"
# Build-time resources: the executable's icon and its VERSIONINFO block. The
# manifest stays with `embed-manifest` above, which hands it to the linker
# directly, so the two do not fight over the resource section. The `toml`
# default feature (a second, private `toml` for manifest metadata) is not
# used: every property is set from this crate's `build.rs`.
winresource = { version = "0.1.34", default-features = false }

# The control channel's pipe (`src/control.rs`): `CreateNamedPipeW` and friends
# are the `windows` crate, the same dependency and the same mechanism the
# single-instance channel in `rustamp-platform` uses. No new package enters
# the lockfile; the three features are the ones the pipe and its handles need.
# `Win32_System_DataExchange` (`OpenClipboard`/`GetClipboardData`) and
# `Win32_System_Memory` (`GlobalLock`/`GlobalSize`) are the clipboard read
# behind `Ctrl`+`V` in a dialog's entry field (`src/clipboard.rs`); they are
# features of the same package, so nothing new enters the lockfile either.
[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Pipes",
]
