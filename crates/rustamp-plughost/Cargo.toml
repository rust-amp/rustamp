[package]
name = "rustamp-plughost"
description = "Rustamp: 32-bit plugin host process (rustamp-plughost32.exe)"
version.workspace = true
edition.workspace = true
# Permissive on purpose (RFC 0004): this process loads plugin DLLs, so its
# license must impose no copyleft on any plugin, of any license.
license = "MIT OR Apache-2.0"
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[[bin]]
name = "rustamp-plughost32"
path = "src/main.rs"

# The clean-room general-purpose ("gen_") plugin fixture for the P3 DLL
# acceptance (docs/tasks/P3-dll-acceptance.md §2). It is a separate cdylib
# artifact that the acceptance test loads through the OS loader; it is never
# linked into the host or into the test binary, so it cannot be mistaken for
# a mocked or statically linked plugin.
[[example]]
name = "gen_rustamp_fixture"
crate-type = ["cdylib"]

[dependencies]
rustamp-ipc.workspace = true
rustamp-plugin-abi.workspace = true
rustamp-proto.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }
