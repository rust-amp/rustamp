[package]
name = "rustamp-ui"
description = "Rustamp: Window components and widgets, hit testing, docking and snapping, windowshade, double-size, easy-move and menus."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
rustamp-core.workspace = true
# The page list, names, default page and command mapping behind the
# preferences dialog (`DialogKind::Preferences`).
rustamp-prefs.workspace = true
# The RFC 0005 `Command` payload enums (`OpenMediaKind`, `JumpTarget`,
# `PrefsPage`) are not in `rustamp-core`'s explicit re-export list; importing
# them from the permissive `rustamp-proto` avoids a `rustamp-core` contract
# change (reported as a finding in task card I1).
rustamp-proto.workspace = true
rustamp-platform.workspace = true
rustamp-skin.workspace = true
rustamp-gfx.workspace = true
thiserror.workspace = true
winit.workspace = true
softbuffer.workspace = true

[dev-dependencies]
# Golden images for the built-in skin (`tests/golden_lookalike.rs`).
rustamp-testkit.workspace = true
